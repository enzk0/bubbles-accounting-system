services:
  # Managed PostgreSQL — recommended instead of self-hosted DB
  - type: web
    name: backend
    env: docker
    repo: https://github.com/2402-XU-CSCC22A/groupG
    dockerfilePath: ./backend/Dockerfile
    buildFilter:
      paths:
        - backend/**
    envVars:
      - fromGroup: groupg-backend-env
    plan: free  # Or use standard if you need autoscaling

  - type: web
    name: frontend
    env: docker
    repo: https://github.com/2402-XU-CSCC22A/groupG
    dockerfilePath: ./frontend/Dockerfile
    buildFilter:
      paths:
        - frontend/**
    envVars:
      - fromGroup: groupg-frontend-env
    plan: free  # Or use standard if you need autoscaling

  - type: web
    name: nginx
    env: docker
    repo: https://github.com/2402-XU-CSCC22A/groupG
    dockerfilePath: ./nginx_prod/Dockerfile
    buildFilter:
      paths:
        - nginx_prod/**
    envVars:
      - fromGroup: groupg-nginx-env
    plan: free  # Or use standard if you need autoscaling

